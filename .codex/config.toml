[workspace]
root = "/Users/ursmuff/source/merly.ai"
name = "merly.ai"
primary_runtime = "scripts/thread-runtime.sh"

[runtime]
license_env_var = "MM_KEY"
e2e_base_url = "http://localhost:3000"
required_tooling = ["docker", "node", "npm", "git", "curl"]

[delivery]
default_chain = ["Test", "Staging", "Pre-Release", "Release"]
promotion_entry = "scripts/thread-runtime.sh"
promotion_command = "promote"
e2e_stack_command = "smoke"

[paths]
thread_runtime_script = "scripts/thread-runtime.sh"
e2e_repo = "mentor-tests"
installer_repo = "Merly.Installer"
daemon_repo = "Mentor.Bridge"
ui_repo = "Mentor.UI"
portal_repo = "Merly.WebPortal"

[docs]
operating_instructions = [
  "docs/process/agent-codex-instructions.md",
  "docs/process/thread-runtime-and-delivery.md",
  "docs/process/daemon-test-to-pre-release.md"
]
thread_template = "docs/process/thread-template.md"
