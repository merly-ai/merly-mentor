  /users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Users]
      operationId: getUser
      summary: Get user details
      description: |
        Retrieves a single user's profile details, including role and last update timestamp.
        Use this endpoint after listing users when you need a full record for one account.
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 7
                name: "Platform Admin"
                email: "admin@merly.ai"
                role: "admin"
                active: true
                _links:
                  self: "/api/v2/users/7"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [Users]
      operationId: patchUser
      summary: Update user
      description: |
        Updates user profile. Users can update their own profile.
        Admins can update any user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
            example:
              role: "lead"
              active: true
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 18
                name: "New Engineer"
                email: "new.engineer@merly.ai"
                role: "lead"
                active: true
                _links:
                  self: "/api/v2/users/18"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: Deletes a user account (requires admin privileges).
      responses:
        '204':
          description: User deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

