    # -------------------------------------------------------------------------
    # RBL Schemas
    # -------------------------------------------------------------------------
    RBL:
      type: object
      description: Repository-Branch-Language analysis context
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        repository_id:
          type: integer
          format: int32
          readOnly: true
        branch_id:
          type: integer
          format: int32
          readOnly: true
        language:
          type: string
          enum: [C, CPP, PYTHON, JAVA, JAVASCRIPT, TYPESCRIPT, GO, RUST, CSHARP, RUBY, PHP, SWIFT, KOTLIN]
        status:
          type: string
          enum: [active, scanning, paused, error]
        lifetime_mentor_score:
          type: number
          format: float
          nullable: true
        last_score:
          type: number
          format: float
          nullable: true
        last_issue_count:
          type: integer
          nullable: true
        last_analyzed_at:
          type: string
          format: date-time
          nullable: true
        earliest_point_date:
          type: string
          format: date-time
          nullable: true
        author_count:
          type: integer
        snapshot_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 789
        repository_id: 123
        branch_id: 456
        language: "PYTHON"
        status: "active"
        lifetime_mentor_score: 82.3
        last_score: 80.6
        last_issue_count: 17
        last_analyzed_at: "2026-03-02T18:41:00Z"
        earliest_point_date: "2026-01-10T11:00:00Z"
        author_count: 14
        snapshot_count: 28
        created_at: "2026-01-10T11:00:00Z"
        updated_at: "2026-03-02T18:41:00Z"
        _links:
          self: "/api/v2/rbls/789"
          snapshots: "/api/v2/rbls/789/snapshots"
          issues: "/api/v2/rbls/789/issues"

    PatchRBLRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, paused]
      example:
        status: "paused"

    # -------------------------------------------------------------------------
    # Snapshot Schemas
    # -------------------------------------------------------------------------
    Snapshot:
      type: object
      description: Point-in-time analysis snapshot (RBL Point)
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        rbl_id:
          type: integer
          format: int32
          readOnly: true
        branch_id:
          type: integer
          format: int32
          readOnly: true
        repository_id:
          type: integer
          format: int32
          readOnly: true
        point_ref:
          type: string
          description: Git commit SHA
          example: "abc123def456"
        point_time:
          type: string
          format: date-time
          description: Timestamp of the git commit
        language:
          type: string
        score:
          type: number
          format: float
        content_files:
          type: integer
          description: Number of files analyzed
        content_size:
          type: integer
          description: Total size in bytes
        lines_of_code:
          type: integer
        issue_count:
          type: integer
          description: Total issues found
        anomaly_count:
          type: integer
        notable_count:
          type: integer
        expression_count:
          type: integer
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 1011
        rbl_id: 789
        branch_id: 456
        repository_id: 123
        point_ref: "abc123def456"
        point_time: "2026-03-01T14:20:00Z"
        language: "PYTHON"
        score: 80.6
        content_files: 132
        content_size: 1489203
        lines_of_code: 27180
        issue_count: 17
        anomaly_count: 4
        notable_count: 8
        expression_count: 932
        _links:
          self: "/api/v2/rbls/789/snapshots/1011"
          issues: "/api/v2/rbls/789/snapshots/1011/issues"

    CreateSnapshotRequest:
      type: object
      description: Request payload for creating new analysis snapshots.
      required:
        - method
      properties:
        method:
          type: string
          enum: [single, count, duration, ref]
          description: |
            - `single`: Analyze at HEAD
            - `count`: Create N snapshots at evenly-spaced commits
            - `duration`: Create snapshots within last N days
            - `ref`: Analyze at specific git ref
        value:
          type: integer
          minimum: 1
          description: |
            Required for `count` and `duration` methods.
            Interpreted as:
            - `count`: number of snapshots to create
            - `duration`: lookback window in days
        ref:
          type: string
          description: Git ref (commit SHA, tag, branch) required for `ref` method
      example:
        method: "single"

    # -------------------------------------------------------------------------
