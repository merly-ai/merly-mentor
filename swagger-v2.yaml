        comment: null
        category_id: 4
        reporter_id: null
        reported_at: null
        assignee_id: 7
        assigned_at: "2026-03-02T19:00:00Z"
        updated_at: "2026-03-02T19:00:00Z"
        _links:
          self: "/api/v2/rbls/789/issues/321:0"
          insights: "/api/v2/rbls/789/issues/321:0/expression-insights"

