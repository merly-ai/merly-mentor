    # -------------------------------------------------------------------------
    # Report Schemas
    # -------------------------------------------------------------------------
    AnalysisReport:
      type: object
      description: Comprehensive analysis report with code quality metrics and insights
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        repository_id:
          type: integer
          format: int32
          readOnly: true
        rbl_id:
          type: integer
          format: int32
          nullable: true
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
        summary:
          type: object
          description: High-level summary metrics
          properties:
            total_files:
              type: integer
            total_lines:
              type: integer
            total_issues:
              type: integer
            average_score:
              type: number
              format: float
        trends:
          type: object
          description: Trend analysis over time
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 510
        repository_id: 123
        rbl_id: 789
        generated_at: "2026-03-02T18:42:00Z"
        summary:
          total_files: 132
          total_lines: 27180
          total_issues: 17
          average_score: 80.6
        trends:
          score_delta_30d: 2.8
          issues_delta_30d: -4
        _links:
          self: "/api/v2/repositories/123/analysis-reports/510"

    Report:
      type: object
      description: Analysis report for a branch or RBL
      properties:
