  # ---------------------------------------------------------------------------
  # Files - Source Code Files
  # ---------------------------------------------------------------------------
  /rbls/{rbl_id}/files:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Files]
      operationId: listRblFiles
      summary: List files for an RBL
      description: |
        Retrieves all source code files analyzed in an RBL.
        Files are organized by language and include metadata such as path, size,
        and line counts.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: file_path
          in: query
          schema:
            type: string
          description: Filter by file path (supports wildcards)
        - name: extension
          in: query
          schema:
            type: string
          description: Filter by file extension (e.g., ".py", ".js")
      responses:
        '200':
          description: List of files
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/File'
              example:
                data:
                  - id: 41
                    rbl_id: 789
                    path: "src/security/auth.py"
                    extension: ".py"
                    total_lines: 420
                    code_lines: 331
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/files?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/files/{file_id}:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: File ID (unique within RBL)

    get:
      tags: [Files]
      operationId: getRblFile
      summary: Get file details
      description: |
        Retrieves detailed information about a specific file including its path,
        size, line counts, and associated expressions.
        
        **Note**: File IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '200':
          description: File details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/File'
              example:
                id: 41
                rbl_id: 789
                path: "src/security/auth.py"
                extension: ".py"
                total_lines: 420
                code_lines: 331
                expressions_count: 14
                _links:
                  self: "/api/v2/rbls/789/files/41"
                  versions: "/api/v2/rbls/789/files/41/versions"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/files/{file_id}/versions:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: File ID (unique within RBL)

    get:
      tags: [Files]
      operationId: listRblFileVersions
      summary: List file version history
      description: |
        Retrieves the version history for a specific file across all snapshots
        in an RBL. Each version represents the file at a specific git commit.
        
        **Note**: File IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
