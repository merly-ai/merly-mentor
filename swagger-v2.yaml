        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of file versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/FileVersion'
              example:
                data:
                  - id: 8401
                    file_id: 41
                    snapshot_id: 1011
                    commit_sha: "abc123def456"
                    committed_at: "2026-03-02T17:30:00Z"
                    lines_added: 10
                    lines_removed: 2
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/snapshots/1011/file-versions?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Expressions - Code Patterns
  # ---------------------------------------------------------------------------
  /rbls/{rbl_id}/expressions:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Expressions]
      operationId: listRblExpressions
      summary: List expressions for an RBL
      description: |
        Retrieves all code expressions (patterns) detected in an RBL.
        Expressions represent code patterns identified by the analysis engine,
        including their scores, costs, and classifications.

        **Open expressions note**: this endpoint does not provide an `open` status parameter.
        If you need only expressions tied to open issues:
        1) call `/rbls/{rbl_id}/issues?status=open`
        2) parse `issue_id` values (`expression_id:index`)
        3) match those `expression_id` values against this expression list (or call expression-by-id routes).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: expression_class
          in: query
          schema:
            type: integer
            example: 4
          description: Filter by expression class
        - name: min_score
          in: query
          schema:
            type: number
            format: float
            example: 0.5
          description: Filter by minimum score
      responses:
        '200':
          description: List of expressions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Expression'
              example:
                data:
                  - id: 321
                    rbl_id: 789
                    snippet_id: 4451
                    snippet_text: "if token and token.is_valid():"
                    score: 0.72
                    cost: 14.3
                    expression_class: 4
                    expression_type: 2
                    state: 1
                    _links:
                      self: "/api/v2/rbls/789/expressions/321"
                      insights: "/api/v2/rbls/789/expressions/321/insights"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/expressions?min_score=0.5&limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/expressions/{expression_id}:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - name: expression_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Expression ID (unique within RBL)

    get:
      tags: [Expressions]
      operationId: getRblExpression
      summary: Get expression details
      description: |
        Retrieves detailed information about a specific expression including
        its snippet, score, cost, and associated instances.
        
        **Note**: Expression IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '200':
          description: Expression details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expression'
              example:
                id: 321
                rbl_id: 789
                snippet_id: 4451
                snippet_text: "if token and token.is_valid():"
                score: 0.72
                cost: 14.3
                expression_class: 4
                expression_type: 2
                state: 1
                _links:
                  self: "/api/v2/rbls/789/expressions/321"
                  insights: "/api/v2/rbls/789/expressions/321/insights"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/snapshots/{snapshot_id}/expressions:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - $ref: '#/components/parameters/SnapshotId'

    get:
      tags: [Expressions]
      operationId: listRblSnapshotExpressions
      summary: List expressions in a snapshot
      description: |
        Retrieves all expressions present in a specific snapshot.
        This provides a point-in-time view of code patterns at a specific git commit.
        
        **Note**: Snapshot IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of expressions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Expression'
              example:
                data:
                  - id: 321
                    rbl_id: 789
                    snippet_text: "if token and token.is_valid():"
                    score: 0.72
                    expression_class: 4
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/snapshots/1011/expressions?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/issues/{issue_id}/expression-insights:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - $ref: '#/components/parameters/IssueId'

    get:
      tags: [Expressions]
      operationId: getRblIssueExpressionInsights
      summary: Get expression insights for an issue
      description: |
        Retrieves expression insights (analysis metadata) for a specific issue.
        Insights provide detailed information about how expressions relate to issues,
        including rendered HTML content, view counts, and voting data.

        This endpoint returns only:
        - `200` with a JSON array of insight objects (empty array when no insight is available yet)
        - `202` with a `job_key` while insight generation is running

        Poll `/jobs/{job_key}` and call this endpoint again until you receive terminal insight data.
        
        **Note**: Issue IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '200':
          description: Expression insights array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpressionInsightResult'
              examples:
                empty_insights:
                  summary: No insights currently available
                  value: []
                single_insight_array:
                  summary: Single insight wrapped in array
                  value:
                    - id: 901
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>This expression frequently appears in auth paths and should be reviewed.</p>"
                      views: 12
                      up_votes: 5
                      down_votes: 1
                      _links:
                        self: "/api/v2/rbls/789/issues/321:0/expression-insights"
                multiple_insights:
                  summary: Multiple insight objects
                  value:
                    - id: 901
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>Insight A</p>"
                      views: 12
                      up_votes: 5
                      down_votes: 1
                    - id: 902
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>Insight B</p>"
                      views: 4
                      up_votes: 1
                      down_votes: 0
        '202':
          description: Insight generation accepted; poll job then retry endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_key: "r-123-rb-456-rbl-789@generate_insight"
                status: "pending"
                message: "Insight generation queued"
                _links:
                  job: "/api/v2/jobs/r-123-rb-456-rbl-789@generate_insight"
        '502':
          description: Upstream daemon returned an invalid non-JSON insights payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/expressions/{expression_id}/insights:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - name: expression_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Expression ID (unique within RBL)

    get:
      tags: [Expressions]
      operationId: getRblExpressionInsights
      summary: Get insights for an expression
      description: |
        Retrieves insights (analysis metadata) for a specific expression.
        Insights provide detailed information about the expression including
        rendered HTML content, view counts, and voting data.

        This endpoint returns only:
        - `200` with a JSON array of insight objects (empty array when no insight is available yet)
        - `202` with a `job_key` while insight generation is running

        Poll `/jobs/{job_key}` and call this endpoint again until you receive terminal insight data.
        
        **Note**: Expression IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '200':
          description: Expression insights array
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpressionInsightResult'
              examples:
                empty_insights:
                  summary: No insights currently available
                  value: []
                single_insight_array:
                  summary: Single insight wrapped in array
                  value:
                    - id: 901
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>This expression frequently appears in auth paths and should be reviewed.</p>"
                      views: 12
                      up_votes: 5
                      down_votes: 1
                      _links:
                        self: "/api/v2/rbls/789/expressions/321/insights"
                multiple_insights:
                  summary: Multiple insight objects
                  value:
                    - id: 901
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>Insight A</p>"
                      views: 12
                      up_votes: 5
                      down_votes: 1
                    - id: 902
                      expression_id: 321
                      issue_id: "321:0"
                      html: "<p>Insight B</p>"
                      views: 4
                      up_votes: 1
                      down_votes: 0
        '202':
          description: Insight generation accepted; poll job then retry endpoint
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_key: "r-123-rb-456-rbl-789@generate_insight"
                status: "pending"
                message: "Insight generation queued"
                _links:
                  job: "/api/v2/jobs/r-123-rb-456-rbl-789@generate_insight"
        '502':
          description: Upstream daemon returned an invalid non-JSON insights payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Watch Configs - Analysis Configuration
  # ---------------------------------------------------------------------------
  /rbls/{rbl_id}/watch-configs:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [WatchConfigs]
      operationId: listRblWatchConfigs
      summary: List watch configs for an RBL
      description: |
        Retrieves all watch configurations for an RBL.
        Watch configs define analysis settings and monitoring rules for code patterns.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of watch configs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WatchConfig'
              example:
                data:
                  - id: 55
                    rbl_id: 789
                    score_enabled: true
                    score_change_amount: 10
                    issues_enabled: true
                    introduced_amount: 1
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/watch-configs?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [WatchConfigs]
      operationId: createRblWatchConfig
      summary: Create watch config for an RBL
      description: |
        Creates a new watch configuration for an RBL.
        Watch configs define analysis settings and monitoring rules.

        Notification delivery is best-effort. If the watch configuration is created
        successfully but notification transport fails, the API still returns `201`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWatchConfigRequest'
            example:
              score_enabled: true
              score_change_dir: 2
              score_change_amount: 10
              score_change_type: 0
              score_freq: 50
              score_freq_type: 0
              issues_enabled: true
              anomalies_introduced: true
              notables_introduced: false
              introduced_amount: 1
              issues_introduced_change_type: 0
              anomalies_removed: false
              notables_removed: false
              removed_amount: 1
              issues_removed_change_type: 0
              issues_freq: 50
              issues_freq_type: 0
      responses:
        '201':
          description: Watch config created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchConfig'
              example:
                id: 55
                rbl_id: 789
                score_enabled: true
                score_change_amount: 10
                issues_enabled: true
                introduced_amount: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Watch config service timeout or internal processing error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbls/{rbl_id}/watch-configs/{config_id}:
    parameters:
      - $ref: '#/components/parameters/RblId'
      - name: config_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: Watch config ID (unique within RBL)

    get:
      tags: [WatchConfigs]
      operationId: getRblWatchConfig
      summary: Get watch config details
      description: |
        Retrieves detailed information about a specific watch configuration.
        
        **Note**: Config IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '200':
          description: Watch config details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchConfig'
              example:
                id: 55
                rbl_id: 789
                score_enabled: true
                score_change_amount: 10
                issues_enabled: true
                introduced_amount: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags: [WatchConfigs]
      operationId: patchRblWatchConfig
      summary: Update watch config (partial)
      description: |
        Updates a watch configuration. Only specified fields are updated.
        
        **Note**: Config IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWatchConfigRequest'
            example:
              score_enabled: true
              score_change_amount: 15
              issues_enabled: true
              introduced_amount: 2
      responses:
        '200':
          description: Watch config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchConfig'
              example:
                id: 55
                rbl_id: 789
                score_enabled: true
                score_change_amount: 15
                issues_enabled: true
                introduced_amount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Watch config service timeout or internal processing error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      tags: [WatchConfigs]
      operationId: updateRblWatchConfig
      deprecated: true
      summary: Update watch config (legacy alias)
      description: |
        Backward-compatible alias for `PATCH /rbls/{rbl_id}/watch-configs/{config_id}`.
        Behavior is partial update (PATCH semantics).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchWatchConfigRequest'
            example:
              score_enabled: true
              score_change_amount: 15
              issues_enabled: true
              introduced_amount: 2
      responses:
        '200':
          description: Watch config updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchConfig'
              example:
                id: 55
                rbl_id: 789
                score_enabled: true
                score_change_amount: 15
                issues_enabled: true
                introduced_amount: 2
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Watch config service timeout or internal processing error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [WatchConfigs]
      operationId: deleteRblWatchConfig
      summary: Delete watch config
      description: |
        Removes a watch configuration.
        
        **Note**: Config IDs are unique only within an RBL context, so the RBL ID
        must be specified in the path.
      responses:
        '204':
          description: Watch config deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Watch config service timeout or internal processing error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ---------------------------------------------------------------------------
  # Reports - Analysis Reports
  # ---------------------------------------------------------------------------
  /repositories/{repository_id}/analysis-reports:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'

    get:
      tags: [Reports]
      operationId: listRepositoryAnalysisReports
      summary: List analysis reports for a repository
      description: |
        Retrieves analysis reports for a repository.
        Reports provide high-level summaries of code quality, trends, and insights
        across all branches and languages in the repository.

        Use this endpoint for repository-level report validation in end-to-end flows.
        Trigger a fresh snapshot on the target RBL first, wait for job completion,
        then fetch this route to read the updated repository report stream.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of analysis reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalysisReport'
              example:
                data:
                  - id: 510
                    repository_id: 123
                    rbl_id: 789
                    generated_at: "2026-03-02T18:42:00Z"
                    summary:
                      total_files: 132
                      total_lines: 27180
                      total_issues: 17
                      average_score: 80.6
                    trends:
                      score_delta_30d: 2.8
                      issues_delta_30d: -4
                    _links:
                      self: "/api/v2/repositories/123/analysis-reports/510"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/repositories/123/analysis-reports?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rbls/{rbl_id}/analysis-reports:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Reports]
      operationId: listRblAnalysisReports
      summary: List analysis reports for an RBL
      description: |
        Retrieves analysis reports for a specific RBL.
        Reports provide detailed summaries of code quality, trends, and insights
        for a specific branch+language context.

        This endpoint is read-only and does not trigger report generation.
        To refresh report data, run `POST /rbls/{rbl_id}/snapshots` and wait for job completion.
        For repository-wide reports, use `GET /repositories/{repository_id}/analysis-reports`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of analysis reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AnalysisReport'
              example:
                data:
                  - id: 510
                    repository_id: 123
                    rbl_id: 789
                    generated_at: "2026-03-02T18:42:00Z"
                    summary:
                      total_files: 132
                      total_lines: 27180
                      total_issues: 17
                      average_score: 80.6
                    trends:
                      score_delta_30d: 2.8
                      issues_delta_30d: -4
                    _links:
                      self: "/api/v2/rbls/789/analysis-reports/510"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/analysis-reports?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /branches/{branch_id}/reports:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    get:
      tags: [Reports]
      operationId: listBranchReports
      summary: List reports for a branch
      description: |
        Retrieves analysis reports for a branch.
        Reports provide summaries of code quality and insights across all languages
        in the branch.

        If report generation is triggered asynchronously by backend logic, the response
        includes `X-Report-Generation-Jobs` and an empty data list until jobs finish.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of reports
          headers:
            X-Report-Generation-Jobs:
              description: Optional comma-separated report generation job keys when report refresh was triggered
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
              example:
                data:
                  - id: 610
                    branch_id: 456
                    rbl_id: 789
                    generated_at: "2026-03-02T18:42:00Z"
                    metrics:
                      score: 80.6
                      issues: 17
                      files: 132
                    _links:
                      self: "/api/v2/rbls/789/reports/610"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/branches/456/reports?limit=20"
                  next: null
                  prev: null
        '400':
          description: Insufficient branch data available to generate or return reports
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal report retrieval or generation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /rbls/{rbl_id}/reports:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Reports]
      operationId: listRblReports
      summary: List reports for an RBL
      description: |
        Retrieves analysis reports for a specific RBL.
        Reports provide detailed summaries of code quality and insights
        for a specific branch+language context.

        This endpoint is read-only and does not trigger report generation.
        To refresh report data, run `POST /rbls/{rbl_id}/snapshots` and wait for job completion.

        **Difference vs `/analysis-reports`**:
        - `/rbls/{rbl_id}/reports` returns `Report` items (lightweight report shape).
        - `/rbls/{rbl_id}/analysis-reports` returns `AnalysisReport` items (expanded summary/trend shape).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Report'
              example:
                data:
                  - id: 610
                    branch_id: 456
                    rbl_id: 789
                    generated_at: "2026-03-02T18:42:00Z"
                    metrics:
                      score: 80.6
                      issues: 17
                      files: 132
                    _links:
                      self: "/api/v2/rbls/789/reports/610"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/reports?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Languages - Programming Languages
  # ---------------------------------------------------------------------------
  /repositories/{repository_id}/languages:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'

    get:
      tags: [Languages]
      operationId: listRepositoryLanguages
      summary: List languages in a repository
      description: |
        Retrieves all programming languages detected across all branches in a repository.
        Each language entry includes statistics such as file counts, line counts,
        and analysis status.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of languages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Language'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /branches/{branch_id}/languages:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    get:
      tags: [Languages]
      operationId: listBranchLanguages
      summary: List languages in a branch
      description: |
        Retrieves all programming languages detected in a branch.
        Each language entry includes statistics such as file counts, line counts,
        and analysis status.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of languages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Language'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Password Management
  # ---------------------------------------------------------------------------
  /users/{user_id}/password:
    parameters:
      - $ref: '#/components/parameters/UserId'

    put:
      tags: [Users]
      operationId: updateUserPassword
      summary: Update user password
      description: |
        Updates the password for a user account.
        
        **Access Control**: Users can update their own password. Admins can update
        any user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePasswordRequest'
            example:
              current_password: "OldPassword!123"
              new_password: "NewPassword!456"
      responses:
        '204':
          description: Password updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/password-reset:
    post:
      tags: [Users]
      operationId: requestPasswordReset
      summary: Request password reset
      description: |
        Initiates a password reset process for a user account.
        This endpoint sends a password reset email to the user's registered email address.
        
        **Security**: This endpoint does not require authentication and always returns
        the same `202` message to avoid revealing whether an account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: "developer@merly.ai"
      responses:
        '202':
          description: Password reset request accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password reset email sent if account exists"
              example:
                message: "Password reset email sent if account exists"
        '400':
          $ref: '#/components/responses/BadRequest'

  # ---------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------
  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Search across resources
      description: |
        Performs a full-text search across repositories, branches, issues, and files.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query
        - name: type
          in: query
          schema:
            type: array
            items:
              type: string
              enum: [repository, branch, rbl, snapshot, issue, file]
          style: form
          explode: false
          description: Limit search to specific resource types
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

# =============================================================================
# COMPONENTS
# =============================================================================

components:
  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------
  parameters:
    RepositoryId:
      name: repository_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: Repository ID

    BranchId:
      name: branch_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: Branch ID

    RblId:
      name: rbl_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: RBL (Repository-Branch-Language) ID

    SnapshotId:
      name: snapshot_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: Snapshot (RBL Point) ID

    IssueId:
      name: issue_id
      in: path
      required: true
      schema:
        type: string
      description: |
        Issue ID in format `expression_id:index`.
        Example: for `321:0`, the expression ID component is `321`.
        URL-encode this value when placing it in the request path (`321%3A0`).
      example: "123:0"

    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: User ID

    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        example: "eyJpZCI6Nzg5fQ=="
      description: Pagination cursor for the next page

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
        example: 20
      description: Maximum items per page

    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: "-updated_at,name"
      description: |
        Sort fields, comma-separated. Prefix with `-` for descending.
        Example: `-created_at,name`

    Filter:
      name: filter
      in: query
      schema:
        type: string
        example: '{"status":"active","language":"PYTHON"}'
      description: |
        JSON-encoded filter object.
        Example: `{"status":"active","language":"python"}`

  # ---------------------------------------------------------------------------
  # Response Definitions
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: Unauthorized - invalid or missing authentication
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Forbidden - insufficient privileges
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Conflict - resource already exists
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ValidationError:
      description: Validation error
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ProblemDetail'
              - type: object
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ValidationErrorItem'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:
    # -------------------------------------------------------------------------
    # Common/Shared Schemas
    # -------------------------------------------------------------------------
    HealthStatus:
      type: object
      description: Health status of the bridge and daemon
      required:
        - status
        - daemon
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
          description: |
            Overall bridge service health status.
            `unhealthy` indicates degraded daemon dependency while bridge remains reachable.
        version:
          type: string
          description: Bridge version
        uptime:
          type: number
          format: float
          description: Uptime in seconds
        daemon:
          type: string
          enum: [ok, down, inconclusive]
          description: Daemon health state
        database:
          type: object
          description: Database lock status
        daemon_status:
          type: object
          properties:
            state:
              type: string
              enum: [ok, down, inconclusive]
            fail_count:
              type: integer
            threshold:
              type: integer
      example:
        status: ok
        version: "2.0.0"
        uptime: 12435.5
        daemon: ok
        database:
          lock: false
        daemon_status:
          state: ok
          fail_count: 0
          threshold: 3

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details for HTTP APIs
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type
          example: "https://api.merly.ai/problems/not-found"
        title:
          type: string
          description: Short, human-readable summary
          example: "Resource Not Found"
        status:
          type: integer
          description: HTTP status code
          example: 404
        detail:
          type: string
          description: Human-readable explanation
          example: "Repository with ID 123 was not found"
        instance:
          type: string
          format: uri
          description: URI of the specific occurrence
          example: "/api/v2/repositories/123"
        trace_id:
          type: string
          description: Request trace ID for debugging
          example: "abc123def456"
      example:
        type: "https://api.merly.ai/problems/not-found"
        title: "Resource Not Found"
        status: 404
        detail: "Repository with ID 123 was not found"
        instance: "/api/v2/repositories/123"
        trace_id: "abc123def456"

    ValidationErrorItem:
      type: object
      properties:
        field:
          type: string
          description: Field that failed validation
          example: "git_url"
        message:
          type: string
          description: Validation error message
          example: "must be a valid git URL"
        code:
          type: string
          description: Error code
          example: "invalid_format"

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        pagination:
          $ref: '#/components/schemas/PaginationInfo'
        _links:
          $ref: '#/components/schemas/PaginationLinks'
      example:
        data:
          - id: 123
        pagination:
          total: 1
          limit: 20
          has_more: false
          next_cursor: null
        _links:
          self: "/api/v2/resource?limit=20"
          next: null
          prev: null

    PaginationInfo:
      type: object
      properties:
        total:
          type: integer
          description: Total number of items
        limit:
          type: integer
          description: Items per page
        has_more:
          type: boolean
          description: Whether more pages exist
        next_cursor:
          type: string
          nullable: true
          description: Cursor for next page
      example:
        total: 1
        limit: 20
        has_more: false
        next_cursor: null

    PaginationLinks:
      type: object
      description: HATEOAS pagination links
      properties:
        self:
          type: string
          format: uri
        next:
          type: string
          format: uri
          nullable: true
        prev:
          type: string
          format: uri
          nullable: true
      example:
        self: "/api/v2/repositories?limit=20"
        next: null
        prev: null

    ResourceLinks:
      type: object
      description: HATEOAS resource links
      additionalProperties:
        type: string
        format: uri

    # -------------------------------------------------------------------------
    # Authentication Schemas
    # -------------------------------------------------------------------------
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      example:
        email: "qa-test@merly.ai"
        password: "StrongPassword!123"

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
      example:
        refresh_token: "rt_3b6f72e0e7b94bb4b1833aa9f2f6a08c"

    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (expires in 15 minutes)
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
        token_type:
          type: string
          default: "Bearer"
        expires_in:
          type: integer
          description: Access token expiry in seconds
          example: 900
      example:
        access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.1709491200"
        refresh_token: "rt_3b6f72e0e7b94bb4b1833aa9f2f6a08c"
        token_type: "Bearer"
        expires_in: 900

    # -------------------------------------------------------------------------
    # Repository Schemas
    # -------------------------------------------------------------------------
    BranchInfo:
      type: object
      description: Git branch information with name and last commit date
      properties:
        name:
          type: string
          description: Branch name (e.g., "main", "origin/main")
          example: "main"
        date:
          type: string
          format: date
          description: Last commit date for this branch (YYYY-MM-DD format)
          example: "2025-12-02"

    Exclusions:
      type: object
      description: Repository exclusions (matches MentorConfiguration.hpp exclusions_t)
      properties:
        folders:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string

    Repository:
      type: object
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        name:
          type: string
          example: "mentor-service"
        description:
          type: string
          nullable: true
        git_url:
          type: string
          format: uri
          example: "https://github.com/github/hub.git"
        default_branch:
          type: string
          example: "main"
        status:
          type: string
          enum: [active, cloning, scanning, error, deleted]
          readOnly: true
        source_root:
          type: string
          nullable: true
          description: Local source root path
        git_root:
          type: string
          nullable: true
          description: Git root path if different from source_root
        rbl_id:
          type: integer
          format: int32
          nullable: true
          readOnly: true
          description: RBL (Repository-Branch-Language) ID for the default branch and first detected language. Null if no RBL exists yet.
        auto_update_interval:
          type: integer
          description: Auto-update interval in minutes (0 = disabled)
        branches:
          type: array
          description: Available git branches discovered from the repository (from the last fetch/scan). Each entry contains branch name and last commit date.
          readOnly: true
          items:
            $ref: '#/components/schemas/BranchInfo'
        exclusions:
          $ref: '#/components/schemas/Exclusions'
        contributor_samples:
          type: integer
          format: int32
          description: Number of contributor samples collected for this repository
        updated_at:
          type: string
          format: date-time
          readOnly: true
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 123
        name: "mentor-service"
        description: "Primary service repository"
        git_url: "https://github.com/merly-ai/mentor-service.git"
        default_branch: "main"
        status: "active"
        source_root: "/workspace/mentor-service"
        git_root: "/workspace/mentor-service/.git"
        rbl_id: 789
        auto_update_interval: 60
        branches:
          - name: "main"
            date: "2026-03-01"
        exclusions:
          folders: ["vendor", "third_party"]
          files: ["package-lock.json"]
        contributor_samples: 40
        updated_at: "2026-03-02T18:45:21Z"
        _links:
          self: "/api/v2/repositories/123"
          branches: "/api/v2/repositories/123/branches"
          issues: "/api/v2/repositories/123/issues"

    CreateRepositoryRequest:
      type: object
      required:
        - name
        - git_url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        git_url:
          type: string
          format: uri
        description:
          type: string
          maxLength: 1000
        git_username:
          type: string
          description: Username for private repositories
        git_password:
          type: string
          format: password
          description: Password/token for private repositories
        git_branch:
          type: string
          description: Initial branch to track (defaults to default branch)
        source_root:
          type: string
        git_root:
          type: string
      example:
        name: "mentor-service"
        git_url: "https://github.com/merly-ai/mentor-service.git"
        description: "Primary service repository for mentor analysis"
        git_branch: "main"
        source_root: "/workspace/mentor-service"

    UpdateRepositoryRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
        default_branch:
          type: string
        source_root:
          type: string
        git_root:
          type: string
        auto_update_interval:
          type: integer
      example:
        name: "mentor-service"
        description: "Primary service repository (updated metadata)"
        default_branch: "main"
        source_root: "/workspace/mentor-service"
        auto_update_interval: 60

    PatchRepositoryRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        default_branch:
          type: string
        source_root:
          type: string
        git_root:
          type: string
        auto_update_interval:
          type: integer
      example:
        description: "Repository monitored by platform team"
        auto_update_interval: 30

    RepositoryWithJob:
      allOf:
        - $ref: '#/components/schemas/Repository'
        - type: object
          properties:
            job:
              $ref: '#/components/schemas/JobAccepted'
      example:
        id: 123
        name: "mentor-service"
        git_url: "https://github.com/merly-ai/mentor-service.git"
        default_branch: "main"
        status: "cloning"
        rbl_id: null
        job:
          job_key: "r-123-rb-456@clone"
          status: "pending"
          message: "Repository clone queued"
          _links:
            job: "/api/v2/jobs/r-123-rb-456@clone"

    # -------------------------------------------------------------------------
