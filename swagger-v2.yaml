    # -------------------------------------------------------------------------
    # Password Management Schemas
    # -------------------------------------------------------------------------
    UpdatePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          format: password
          description: Current password (required for self-update)
        new_password:
          type: string
          format: password
          minLength: 8
          description: New password
      example:
        current_password: "CurrentPassword!123"
        new_password: "NewPassword!123"

    PasswordResetRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          description: Email address of the account to reset
      example:
        email: "taylor.dev@merly.ai"

  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token obtained from `/auth/login` or `/auth/token`.
        
        Include in the Authorization header:
        ```
        Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        ```

security:
  - BearerAuth: []
