# =============================================================================
# Mentor API v2 - RESTful API with Industry Best Practices
# =============================================================================
# 
# Key Improvements over v1:
# - Flat resource access (direct /rbls/{id}, /snapshots/{id})
# - Consistent snake_case naming throughout
# - RFC 7807 Problem Details for errors
# - PATCH support for partial updates
# - Hypermedia links (_links) for resource discovery
# - Clear domain model: Repository → Branch → RBL → Snapshot (RBLPoint)
# - Proper HTTP status codes and caching headers
#
# =============================================================================

openapi: 3.0.3
info:
  title: Mentor API
  version: 2.0.0
  description: |
    ## Overview
    
    API v2 for managing and analyzing git-based code repositories with lifetime analysis.

    ### Domain Model
    
    ```
    Repository (Repo)
        └── Branch (RepoBranch)
            └── RBL (RepoBranchLanguage) - analysis context for a branch+language
                └── Snapshot (RBLPoint) - point-in-time analysis snapshot
                    └── Issues, Authors, Files, Expressions
    ```

    ### Key Improvements in v2
    
    - **Flat Resource Access**: Access any resource directly (`/rbls/{id}`) or via hierarchy
    - **Consistent Naming**: All properties use `snake_case`
    - **Standard Errors**: RFC 7807 Problem Details format
    - **Partial Updates**: PATCH support for efficient updates
    - **Hypermedia**: `_links` for resource discovery (HATEOAS)
    - **Proper HTTP Semantics**: Correct status codes, ETags, caching

    ### Pagination
    
    All collection endpoints support cursor-based pagination:
    - `cursor`: Opaque cursor for next page
    - `limit`: Items per page (default: 20, max: 100)
    
    Response includes:
    ```json
    {
      "data": [...],
      "pagination": {
        "total": 150,
        "limit": 20,
        "has_more": true,
        "next_cursor": "eyJpZCI6MjB9"
      }
    }
    ```

    ### Filtering & Sorting
    
    - `sort`: Comma-separated fields, prefix `-` for descending (`sort=-created_at,name`)
    - `filter`: JSON object for field filtering (`filter={"status":"active"}`)

    ### Rate Limiting
    
    Response headers include:
    - `X-RateLimit-Limit`: Requests allowed per window
    - `X-RateLimit-Remaining`: Requests remaining
    - `X-RateLimit-Reset`: Unix timestamp when window resets

    ### Swagger-Only Quickstart (No Prior Knowledge Required)

    The sequence below is sufficient to build a client from scratch and verify the full flow
    (auth -> repository report -> open issues/expressions -> issue insights).

    1. Authenticate and store a bearer token:
       - `POST /auth/login`
       - Use `Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature` for all protected routes.
    2. Register a repository to analyze:
       - `POST /repositories` with `name` and `git_url`.
       - Expect `202 Accepted` with `job.job_key` for async clone/scan.
       - Read `repository_id` from response `id`.
       - Read `job_key` from `job.job_key`, then poll `GET /jobs/{job_key}` to terminal state.
    3. Discover the analysis context:
       - `GET /repositories/{repository_id}/branches`, choose `branch_id`.
       - `GET /branches/{branch_id}/rbls`, choose the `rbl_id` for your target language.
       - Pick `rbl_id` for downstream calls.
    4. Trigger fresh analysis snapshots for report freshness:
       - `POST /rbls/{rbl_id}/snapshots` (use `method=single` for a simple refresh).
       - Poll `GET /jobs/{job_key}` until status is `completed` or terminal failure (`failed`, `canceled`).
    5. Retrieve repository reports:
       - `GET /repositories/{repository_id}/analysis-reports`
       - This returns repository-level reports across branches/languages.
    6. Retrieve open issues from the latest analyzed snapshot:
       - `GET /rbls/{rbl_id}/snapshots?sort=-id&limit=1`, choose `snapshot_id`.
       - `GET /rbls/{rbl_id}/snapshots/{snapshot_id}/issues?status=open`.
    7. Retrieve expressions and derive "open expressions":
       - `GET /rbls/{rbl_id}/expressions`.
       - Parse open issue IDs (`expression_id:index`, e.g. `321:0`) and match by `expression_id`.
    8. Retrieve insights:
       - Issue-scoped: `GET /rbls/{rbl_id}/issues/{issue_id}/expression-insights` (URL-encode `issue_id`, e.g. `321%3A0`)
       - Expression-scoped: `GET /rbls/{rbl_id}/expressions/{expression_id}/insights`
       - If response is `202`, poll `/jobs/{job_key}` and call the insight endpoint again.

    ### Polling Rules

    - Poll cadence: every 2-5 seconds.
    - Terminal job statuses: `completed`, `failed`, `canceled`.
    - Treat `failed` and `canceled` as hard failures for the current flow attempt.

    ### Resource Management Map (RB/RBL/User/Repo)

    - **Repositories (Repo)**:
      - list/create: `GET/POST /repositories`
      - read/update/delete: `GET/PUT/PATCH/DELETE /repositories/{repository_id}`
    - **Branches (RB = RepoBranch)**:
      - list/create under a repo: `GET/POST /repositories/{repository_id}/branches`
      - read/delete: `GET/DELETE /branches/{branch_id}`
    - **RBLs (RepoBranchLanguage)**:
      - discovery: `GET /branches/{branch_id}/rbls` or `GET /rbls`
      - read/update/delete: `GET/PATCH/DELETE /rbls/{rbl_id}`
    - **Issues**:
      - latest by RBL: `GET /rbls/{rbl_id}/issues`
      - by snapshot: `GET /rbls/{rbl_id}/snapshots/{snapshot_id}/issues`
      - single issue: `GET/PATCH /rbls/{rbl_id}/issues/{issue_id}`
      - repository aggregate: `GET /repositories/{repository_id}/issues`
    - **Watch configs**:
      - list/create: `GET/POST /rbls/{rbl_id}/watch-configs`
      - read/update/delete: `GET/PATCH/PUT/DELETE /rbls/{rbl_id}/watch-configs/{config_id}`
    - **Files**:
      - list/read: `GET /rbls/{rbl_id}/files`, `GET /rbls/{rbl_id}/files/{file_id}`
      - version history: `GET /rbls/{rbl_id}/files/{file_id}/versions`
      - snapshot view: `GET /rbls/{rbl_id}/snapshots/{snapshot_id}/file-versions`
    - **Expressions**:
      - list/read: `GET /rbls/{rbl_id}/expressions`, `GET /rbls/{rbl_id}/expressions/{expression_id}`
      - snapshot view: `GET /rbls/{rbl_id}/snapshots/{snapshot_id}/expressions`
      - insights: `GET /rbls/{rbl_id}/issues/{issue_id}/expression-insights`,
        `GET /rbls/{rbl_id}/expressions/{expression_id}/insights`
    - **Users**:
      - list/create: `GET/POST /users`
      - read/update/delete: `GET/PATCH/DELETE /users/{user_id}`
      - password flows: `PUT /users/{user_id}/password`, `POST /users/password-reset`

    ### License Quota Behavior

    - Repository/seat limits are enforced per **license key**, not per user identity.
    - When quota is exhausted, repository/user creation endpoints return clear `400` errors
      from the daemon/backend (for example, `No Repos Remaining`).

  contact:
    name: Merly.ai API Support
    email: support@merly.ai
  license:
    name: Proprietary
    url: https://merly.ai/terms

servers:
  - url: /api/v2
    description: API v2 endpoint
  - url: /api/v1
    description: Legacy API v1 endpoint (deprecated)

tags:
  - name: Health
    description: Service and daemon health state
  - name: Authentication
    description: User authentication and token management
  - name: Repositories
    description: Git repository management
  - name: Branches
    description: Repository branch management
  - name: RBLs
    description: Repository-Branch-Language analysis contexts
  - name: Snapshots
    description: Point-in-time analysis snapshots (RBL Points)
  - name: Issues
    description: Code quality issues detected by analysis
  - name: Authors
    description: Code contributors identified from git commit history
  - name: Files
    description: Source code files analyzed in RBLs
  - name: Expressions
    description: Code patterns detected by analysis engine
  - name: WatchConfigs
    description: Analysis configuration and monitoring rules
  - name: Reports
    description: Analysis reports and code quality metrics
  - name: Languages
    description: Programming languages detected in repositories
  - name: Jobs
    description: Async job tracking
  - name: Users
    description: User management
  - name: Search
    description: Cross-resource search

# =============================================================================
# PATHS
# =============================================================================

paths:
  # ---------------------------------------------------------------------------
  # Health Check
  # ---------------------------------------------------------------------------
  /health:
    get:
      tags:
        - Health
      summary: Health check endpoint
      description: |
        Returns the health status of the bridge and daemon.
        This endpoint does not require authentication.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Health payload (bridge always returns HTTP 200 and encodes unhealthy state in `status`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ---------------------------------------------------------------------------
  # Authentication
  # ---------------------------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate user
      description: |
        Authenticates a user and returns JWT access and refresh tokens.
        
        Access tokens expire in 15 minutes. Use the refresh token to obtain new access tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "qa-test@merly.ai"
              password: "StrongPassword!123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
              example:
                access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.access.1709491200"
                refresh_token: "rt_3b6f72e0e7b94bb4b1833aa9f2f6a08c"
                token_type: "Bearer"
                expires_in: 900
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/token:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Refresh access token
      description: Exchange a valid refresh token for a new access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Logout and invalidate session
      description: Invalidates the current session and refresh token.
      responses:
        '204':
          description: Successfully logged out
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Repositories - Full CRUD
  # ---------------------------------------------------------------------------
  /repositories:
    get:
      tags: [Repositories]
      operationId: listRepositories
      summary: List all repositories
      description: |
        Retrieves a paginated list of all repositories the user has access to.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Filter'
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cloning, error, deleted]
          description: Filter by repository status
      responses:
        '200':
          description: List of repositories
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Repository'
              example:
                data:
                  - id: 123
                    name: "mentor-service"
                    description: "Primary service repository"
                    git_url: "https://github.com/merly-ai/mentor-service.git"
                    default_branch: "main"
                    status: "active"
                    rbl_id: 789
                    updated_at: "2026-03-02T18:45:21Z"
                    _links:
                      self: "/api/v2/repositories/123"
                      branches: "/api/v2/repositories/123/branches"
                      issues: "/api/v2/repositories/123/issues"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/repositories?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Repositories]
      operationId: createRepository
      summary: Add repository for analysis
      description: |
        Adds an existing git repository to the system for analysis.
        
        This is an asynchronous operation. The API returns `202 Accepted` and includes
        a `job.job_key` to track clone progress via `/jobs/{job_key}`.

        The system will clone the repository and begin initial scanning in the background.
        Use the returned `job_key` to track clone progress via `/jobs/{job_key}`.

        Typical client behavior:
        1) create repository
        2) poll clone job to `completed`
        3) list repository branches
        4) list branch RBLs to obtain `rbl_id`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepositoryRequest'
            examples:
              github_public_repo:
                summary: Register a public GitHub repository
                value:
                  name: "github-hub"
                  git_url: "https://github.com/github/hub.git"
                  description: "GitHub CLI helper repository"
      responses:
        '202':
          description: Repository accepted; clone/scan job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoryWithJob'
              example:
                id: 11
                name: "github-hub"
                description: "A command-line tool that makes git easier to use with GitHub."
                git_url: "https://github.com/github/hub.git"
                default_branch: "master"
                status: "cloning"
                source_root: "/opt/merly/git-root/github-hub"
                git_root: "/opt/merly/git-root/github-hub/.git"
                rbl_id: 11
                updated_at: "2026-03-03T20:02:02Z"
                _links:
                  self: "/api/v2/repositories/11"
                  branches: "/api/v2/repositories/11/branches"
                  rbls: "/api/v2/branches/11/rbls"
                job:
                  job_key: "r-11-rb-11-rbl-11@clone"
                  status: "pending"
                  message: "clone queued"
                  _links:
                    job: "/api/v2/jobs/r-11-rb-11-rbl-11@clone"
        '400':
          description: Invalid repository payload or daemon-level repository creation rejection
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                license_repo_limit_reached:
                  summary: License quota prevents additional repositories
                  value:
                    type: "operation_failed"
                    title: "v2 repository POST failed"
                    status: 400
                    detail: "map[err:true status:\"RetCode=400, out=No Repos Remaining\"]"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /repositories/{repository_id}:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'

    get:
      tags: [Repositories]
      operationId: getRepository
      summary: Get repository details
      description: Retrieves detailed information about a specific repository.
      responses:
        '200':
          description: Repository details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
              example:
                id: 123
                name: "mentor-service"
                description: "Primary service repository"
                git_url: "https://github.com/merly-ai/mentor-service.git"
                default_branch: "main"
                status: "active"
                rbl_id: 789
                auto_update_interval: 60
                _links:
                  self: "/api/v2/repositories/123"
                  branches: "/api/v2/repositories/123/branches"
                  issues: "/api/v2/repositories/123/issues"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Repositories]
      operationId: updateRepository
      summary: Update repository (full replace)
      description: Replaces all mutable fields of the repository.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepositoryRequest'
            example:
              name: "mentor-service"
              description: "Primary service repository (updated)"
              default_branch: "main"
              source_root: "/workspace/mentor-service"
              auto_update_interval: 60
      responses:
        '200':
          description: Repository updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
              example:
                id: 123
                name: "mentor-service"
                description: "Primary service repository (updated)"
                git_url: "https://github.com/merly-ai/mentor-service.git"
                default_branch: "main"
                status: "active"
                auto_update_interval: 60
                updated_at: "2026-03-03T20:15:00Z"
                _links:
                  self: "/api/v2/repositories/123"
                  branches: "/api/v2/repositories/123/branches"
                  issues: "/api/v2/repositories/123/issues"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    patch:
      tags: [Repositories]
      operationId: patchRepository
      summary: Partially update repository
      description: Updates only the provided fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchRepositoryRequest'
            example:
              description: "Managed by platform team"
              auto_update_interval: 30
      responses:
        '200':
          description: Repository updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Repository'
              example:
                id: 123
                name: "mentor-service"
                description: "Managed by platform team"
                git_url: "https://github.com/merly-ai/mentor-service.git"
                default_branch: "main"
                status: "active"
                auto_update_interval: 30
                updated_at: "2026-03-03T20:16:00Z"
                _links:
                  self: "/api/v2/repositories/123"
                  branches: "/api/v2/repositories/123/branches"
                  issues: "/api/v2/repositories/123/issues"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Repositories]
      operationId: deleteRepository
      summary: Remove repository from analysis
      description: |
        Removes the repository and all associated data from the system.
        This does not delete the actual git repository, only stops tracking it.
      responses:
        '204':
          description: Repository deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Branches - Nested under Repository + Direct Access
  # ---------------------------------------------------------------------------
  /repositories/{repository_id}/branches:
    parameters:
      - $ref: '#/components/parameters/RepositoryId'

    get:
      tags: [Branches]
      operationId: listRepositoryBranches
      summary: List branches for a repository
      description: |
        Retrieves all branches tracked for analysis in this repository.
        Call this after the repository clone job has completed.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: List of branches
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Branch'
              example:
                data:
                  - id: 456
                    repository_id: 123
                    name: "main"
                    last_commit_sha: "abc123def456"
                    is_default: true
                    lifetime_mentor_score: 81.2
                    _links:
                      self: "/api/v2/branches/456"
                      rbls: "/api/v2/branches/456/rbls"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/repositories/123/branches?limit=20"
                  next: null
                  prev: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Branches]
      operationId: createBranch
      summary: Add branch for analysis
      description: Adds a specific branch from the repository for analysis.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
            example:
              name: "release/2026-03"
      responses:
        '201':
          description: Branch added for analysis
          headers:
            Location:
              schema:
                type: string
              description: URL of the created branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
              example:
                id: 460
                repository_id: 123
                name: "release/2026-03"
                last_commit_sha: "f1a2b3c4d5e6"
                is_default: false
                lifetime_mentor_score: null
                _links:
                  self: "/api/v2/branches/460"
                  rbls: "/api/v2/branches/460/rbls"
        '202':
          description: Branch not yet discovered; fetch queued. Retry after job completion.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_key: "r-123-rb-460-rbl-0@fetch_branches"
                status: "pending"
                message: "Branch discovery queued"
                _links:
                  job: "/api/v2/jobs/r-123-rb-460-rbl-0@fetch_branches"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /branches/{branch_id}:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    get:
      tags: [Branches]
      operationId: getBranch
      summary: Get branch details
      description: Retrieves detailed information about a specific branch.
      responses:
        '200':
          description: Branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Branch'
              example:
                id: 456
                repository_id: 123
                name: "main"
                last_commit_sha: "abc123def456"
                is_default: true
                lifetime_mentor_score: 81.2
                _links:
                  self: "/api/v2/branches/456"
                  rbls: "/api/v2/branches/456/rbls"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Branches]
      operationId: deleteBranch
      summary: Remove branch from analysis
      description: Removes the branch and all associated analysis data.
      responses:
        '204':
          description: Branch deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # RBLs (Repository-Branch-Language) - The Core Analysis Context
  # ---------------------------------------------------------------------------
  /branches/{branch_id}/rbls:
    parameters:
      - $ref: '#/components/parameters/BranchId'

    get:
      tags: [RBLs]
      operationId: listBranchRbls
      summary: List RBLs for a branch
      description: |
        Retrieves all RBL (Repository-Branch-Language) analysis contexts for a branch.
        Each detected programming language in the branch has its own RBL.

        Use this route when branch context is already known and you need the `rbl_id`
        for downstream endpoints (`/snapshots`, `/issues`, `/expressions`, `/reports`).
        Call this after branch discovery is complete.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of RBLs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RBL'
              example:
                data:
                  - id: 789
                    repository_id: 123
                    branch_id: 456
                    language: "PYTHON"
                    status: "active"
                    last_score: 80.6
                    last_issue_count: 17
                    _links:
                      self: "/api/v2/rbls/789"
                      snapshots: "/api/v2/rbls/789/snapshots"
