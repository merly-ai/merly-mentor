  # ---------------------------------------------------------------------------
  # Jobs - Async Operation Tracking
  # ---------------------------------------------------------------------------
  /jobs/{job_key}:
    parameters:
      - name: job_key
        in: path
        required: true
        schema:
          type: string
        description: Unique job identifier
        example: "r-123-rb-456-rbl-789@infer_points"

    get:
      tags: [Jobs]
      operationId: getJobStatus
      summary: Get job status
      description: |
        Retrieves the current status of an async job.
        
        Poll this endpoint to track progress of:
        - Repository cloning (`clone`)
        - Snapshot creation (`infer_points`)
        - Insight generation (`generate_insight`)

        Terminal statuses are: `completed`, `failed`, and `canceled`.
        A typical poll cadence is every 2-5 seconds until terminal state.
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              example:
                job_key: "r-123-rb-456-rbl-789@infer_points"
                status: "running"
                action: "infer_points"
                description: "Generating snapshots for RBL 789"
                progress: 45
                error_message: null
                repository_id: 123
                branch_id: 456
                rbl_id: 789
                started_at: "2026-03-02T19:05:00Z"
                finished_at: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Jobs]
      operationId: cancelJob
      summary: Cancel a running job
      description: Attempts to cancel a job that is pending or running.
      responses:
        '204':
          description: Job canceled
        '400':
          description: Job cannot be canceled (already completed)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

