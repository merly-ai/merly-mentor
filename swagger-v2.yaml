          format: date-time
          nullable: true
        assignee_id:
          type: integer
          nullable: true
        assigned_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: "321:0"
