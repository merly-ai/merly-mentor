          description: Expression score
        cost:
          type: number
          format: float
          description: Expression cost
        expression_class:
          type: integer
          description: Backend-defined expression classification code (treat as opaque integer unless mapping is provided)
        expression_type:
          type: integer
          description: Backend-defined expression type code (treat as opaque integer unless mapping is provided)
        state:
          type: integer
          description: Backend-defined expression lifecycle state code (treat as opaque integer unless mapping is provided)
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 321
        rbl_id: 789
        snippet_id: 4451
        snippet_text: "if token and token.is_valid():"
        score: 0.72
        cost: 14.3
        expression_class: 4
        expression_type: 2
        state: 1
        _links:
          self: "/api/v2/rbls/789/expressions/321"
          insights: "/api/v2/rbls/789/expressions/321/insights"

    ExpressionInsight:
      type: object
      description: Analysis insights and metadata for an expression or issue
      properties:
        id:
          type: integer
          format: int32
          readOnly: true
        expression_id:
          type: integer
          format: int32
          readOnly: true
        issue_id:
          type: string
          readOnly: true
          description: Issue ID if this insight is issue-specific
        html:
          type: string
          description: Rendered HTML content for the insight
        views:
          type: integer
          description: Number of times this insight has been viewed
        up_votes:
          type: integer
          description: Number of up votes
        down_votes:
          type: integer
          description: Number of down votes
        _links:
          $ref: '#/components/schemas/ResourceLinks'
      example:
        id: 901
        expression_id: 321
        issue_id: "321:0"
        html: "<p>This expression frequently appears in auth paths and should be reviewed.</p>"
        views: 12
        up_votes: 5
        down_votes: 1
        _links:
          self: "/api/v2/rbls/789/expressions/321/insights"

    ExpressionInsightResult:
      description: |
        Insight result payload for expression/issue insight endpoints.
        Always returned as an array. Empty array means no insight is currently available.
      type: array
      items:
        $ref: '#/components/schemas/ExpressionInsight'

