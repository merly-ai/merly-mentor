  # ---------------------------------------------------------------------------
  # Snapshots (RBL Points) - Point-in-time Analysis
  # ---------------------------------------------------------------------------
  /rbls/{rbl_id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Snapshots]
      operationId: listRblSnapshots
      summary: List snapshots for an RBL
      description: |
        Retrieves all analysis snapshots (RBL Points) for an RBL.
        Each snapshot represents analysis at a specific git commit.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: from_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter snapshots created after this date
        - name: to_date
          in: query
          schema:
            type: string
            format: date-time
          description: Filter snapshots created before this date
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Snapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Snapshots]
      operationId: createSnapshot
      summary: Create new snapshot(s)
      description: |
        Initiates creation of one or more analysis snapshots.
        
        Snapshot creation is asynchronous. The response includes a `job_key`
        that can be used to track progress via `/jobs/{job_key}`.
        
        Methods:
        - `single`: Analyze at HEAD (value ignored)
        - `count`: Create N snapshots at evenly-spaced commits
        - `duration`: Create snapshots at commits within last N days
        - `ref`: Analyze at specific git ref (commit SHA, tag, branch)

        For a simple "refresh latest RBL report" workflow, prefer `method=single`.

        **Report generation note**: this endpoint is the report-refresh trigger for RBL workflows.
        After the snapshot job completes, fetch updated report data from:
        - `/rbls/{rbl_id}/reports`
        - `/rbls/{rbl_id}/analysis-reports`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotRequest'
            examples:
              head_snapshot:
                summary: Analyze current HEAD (recommended default for report refresh)
                value:
                  method: "single"
              commit_count:
                summary: Generate 10 evenly-spaced snapshots
                value:
                  method: "count"
                  value: 10
              recent_duration:
                summary: Generate snapshots from the last 30 days
                value:
                  method: "duration"
                  value: 30
              specific_ref:
                summary: Analyze a specific branch/tag/commit
                value:
                  method: "ref"
                  ref: "main"
      responses:
        '202':
          description: Snapshot creation job initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAccepted'
              example:
                job_key: "r-123-rb-456-rbl-789@infer_points"
                status: "pending"
                message: "Request queued"
                _links:
                  job: "/api/v2/jobs/r-123-rb-456-rbl-789@infer_points"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Issues - Code Quality Issues
  # ---------------------------------------------------------------------------
  /rbls/{rbl_id}/issues:
    parameters:
      - $ref: '#/components/parameters/RblId'

    get:
      tags: [Issues]
      operationId: listRblIssues
      summary: List issues for an RBL
      description: |
        Retrieves all code quality issues for an RBL from the latest snapshot.
        Issues can be filtered by severity, file, status, etc.
        
        **Note**: This endpoint returns issues from the most recent snapshot.
        For issues from a specific snapshot, use `/rbls/{rbl_id}/snapshots/{snapshot_id}/issues`.
        To fetch open issues only, use `status=open`.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
        - name: severity
          in: query
          description: Filter issues by severity level.
          schema:
            type: string
            enum: [critical, high, medium, low]
            example: "high"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, acknowledged, resolved, ignored]
            example: "open"
          description: Issue workflow status. Use `open` to fetch unresolved issues.
        - name: file_path
          in: query
          schema:
            type: string
          description: Filter by file path (supports wildcards)
        - name: assignee_id
          in: query
          description: Filter issues assigned to a specific user ID.
          schema:
            type: integer
            example: 7
      responses:
        '200':
          description: List of issues
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Issue'
              example:
                data:
                  - id: "321:0"
                    repository_id: 123
                    snapshot_id: 1011
                    expression_instance_id: 5551
                    severity: "high"
                    status: "open"
                    action: "investigate"
                    file_path: "src/security/auth.py"
                    file_line: 184
                    file_column: 12
                    snippet: "token = verify_token(request.headers[\"Authorization\"])"
                    comment: null
                    category_id: 4
                    reporter_id: null
                    reported_at: null
                    assignee_id: 7
                    assigned_at: "2026-03-02T19:00:00Z"
                    updated_at: "2026-03-02T19:00:00Z"
                    _links:
                      self: "/api/v2/rbls/789/issues/321:0"
                      insights: "/api/v2/rbls/789/issues/321:0/expression-insights"
                pagination:
                  total: 1
                  limit: 20
                  has_more: false
                  next_cursor: null
                _links:
                  self: "/api/v2/rbls/789/issues?status=open&limit=20"
                  next: null
                  prev: null
